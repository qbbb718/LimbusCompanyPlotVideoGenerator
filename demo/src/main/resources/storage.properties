# 存储配置

# 背景图片存储目录（相对于应用程序根目录）
storage.backgrounds.dir=assets/backgrounds

# 缩略图存储目录（相对于应用程序根目录）
storage.thumbnails.dir=assets/thumbnails

# 是否启用文件版本控制（文件名中包含哈希值）
storage.enable.versioning=true

# 最大文件大小（MB）
storage.max.file.size=10

# 支持的图片格式
storage.supported.formats=jpg,jpeg,png,gif,bmp

# 是否生成缩略图
storage.generate.thumbnails=true

# 缩略图宽度
storage.thumbnail.width=200

# 缩略图高度
storage.thumbnail.height=200
