server:
  port: 8081

spring:
  application:
    name: limbus-company-plot-video-generator
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/assets/,file:./assets/
  datasource:
    url: jdbc:sqlite:./data/project.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    jdbc:
      dialect: sqlite

# 应用配置
app:
  assets:
    path: ./assets
    audios: ${app.assets.path}/audios
    backgrounds: ${app.assets.path}/backgrounds
    characters: ${app.assets.path}/characters
    thumbnails: ${app.assets.path}/thumbnails
    # 角色目录下存放立绘缩略图与角色名片图片的子目录名
    # 缩略图与名片图片都会保存到 {characters}/{角色拼音}/{characterThumbnailsSubdir}/ 下，
    # 删除角色目录时会一并清理。可自定义，默认 "thumbnails"。
    characterThumbnailsSubdir: thumbnails

# 自定义配置
audio:
  bgm:
    volume: 0.7
    gain: 1.2
  voice:
    volume: 1.0
    gain: 1.0
  sfx:
    volume: 0.8
    gain: 1.5

# 日志配置已移至 logback-spring.xml 和 logback.properties 文件中
