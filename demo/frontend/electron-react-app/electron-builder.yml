appId: com.lbc-plot.video-generator
productName: "LimbusCompany Plot Video Generator"
copyright: "Copyright © 2024"

directories:
  buildResources: build
  output: release

files:
  - build/**/*
  # 主进程用到的 public 下的 .js 全都要进包：
  #   electron.js          入口（package.json 的 main）
  #   preload.js           contextBridge 暴露给渲染进程的 API
  #   color-picker.js      屏幕取色
  #   update-service.js    自动更新（状态机 / 多源探测 / 静默安装）
  #   update-manifest.js   latest.yml 解析（update-service.js 用相对路径 require）
  # 用通配而不是逐个列举：漏一个的后果是安装版启动即 MODULE_NOT_FOUND，或者更新功能静默消失，
  # 而开发模式直接读源码，永远复现不了。
  - public/*.js
  # 屏幕取色的全屏遮罩页面（color-picker.js 用 loadFile 打开）
  - public/color-picker-overlay.html
  # 导出日志的 zip 写入器（electron.js require("./log-export/zip-writer")）。
  # 以前只列了 electron.js / preload.js 等四个文件，这个目录没被包含，历史版本会启动崩溃。
  - public/log-export/**/*
  # node_modules 由 electron-builder 自动按生产依赖打包，无需手动声明

extraResources:
  - from: "../../target"
    to: "."
    filter:
      - "demo-*-SNAPSHOT.jar"
  - from: "../../jre"
    to: "jre"
    filter:
      - "**/*"
  - from: "../../assets"
    to: "assets"
    filter:
      - "**/*"
  - from: "../../resources"
    to: "resources"
    filter:
      - "**/*"
  - from: "../../data"
    to: "data"
    filter:
      - "project.db"
      - "records.json"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: public/logo512.png
  # 安装目录名与可执行文件名取自 executableName（不设时取 productName）。
  # 必须保持无空格：安装路径里带空格时，Spring Boot 3.2 生成的嵌套 jar URL
  # （jar:nested:/.../BOOT-INF/lib/xxx.jar!/...）里会保留这个空格，JavaCV/JavaCPP
  # 解析该 URL 时抛 URISyntaxException，FFmpeg 原生库加载失败（UnsatisfiedLinkError），
  # 而它是 Error 不会被 catch (Exception) 捕获，表现为“导出视频进度永远 0%”。
  # 只影响安装目录/可执行文件名：productName（界面显示名、卸载项名称）、
  # shortcutName 都不变；安装包文件名由 nsis.artifactName 单独指定。
  executableName: LimbusCompanyPlotVideoGenerator
  # 请求管理员权限以确保文件系统操作正常
  requestedExecutionLevel: asInvoker

nsis:
  # 安装包文件名：LCP + 版本号，例如 LCP0.3.5.exe
  # （默认是 "${productName} Setup ${version}.${ext}"，带空格，文件名很长）
  artifactName: "LCP${version}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  # build/installer.nsh（electron-builder 的 nsis.include 默认路径）负责
  # 在「选择安装位置」页面上加“安装路径中不能有中文或空格”的提示
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "边狱巴士剧情视频生成器"
  # 卸载时是否删掉用户数据目录（%APPDATA%/limbus-company-plot-video-generator/，
  # 里面是角色/背景/音频素材与工程库）。
  # 设为 true（原来）时，用户"先卸载再装新版本"这种最朴素的升级方式会连素材一起删掉，
  # 一次丢数据的口碑伤害远大于更新做得多顺；更新本来也只需要覆盖安装、不需要卸载。
  # 想彻底删干净的用户可以自己删那个目录（设置页里能直接打开）。
  deleteAppDataOnUninstall: false

# 打包时额外的资源映射
# assets/ 和 data/ 放在安装目录下，与 backend.jar 同级
# Spring Boot 的 ./assets/ 和 ./data/ 相对路径就能正确解析
