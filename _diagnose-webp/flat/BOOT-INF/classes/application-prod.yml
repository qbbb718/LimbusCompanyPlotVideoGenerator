spring:
  # 注意：这里不能写 spring.profiles=prod。本文件按文件名已经绑定到 prod profile，
  # Spring Boot 3 会因 "spring.profiles" 出现在 profile 专属文档中而直接启动失败。
  redis:
    host: redis.production.local
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# 异步渲染队列（绑定到 com.lbc_plot.config.AsyncQueueProperties）
# 说明：此前本文件里 async:、project:、app:、spring: 各有重复块，YAML 中后出现的键会静默
# 覆盖先出现的，已合并为单一块，避免"改了上面一段却不生效"。键名统一用 kebab-case。
async:
  queue:
    base-dir: /var/lib/lbc_plot
    queue-sub-dir: async_render_jobs
    failed-sub-dir: async_render_jobs_failed
    thread-count: 4
    max-retries: 3
    retry-delay-ms: 1000
    backoff-initial-ms: 1000
    backoff-multiplier: 2.0
    backoff-max-ms: 60000
    max-total-retry-ms: 3600000
    max-attempts: 20

project:
  videoWidth: 1920
  videoHeight: 1080
  videoResolution: "1080p"
  frameRate: 30
  # 注意：不要在这里设置 imageBasePath / ASSETS_BASE_PATH 之类的素材根路径。
  # 素材目录统一由 com.lbc_plot.common.util.RuntimePaths 解析为
  # {dataRoot}/assets 的绝对路径，相对路径会随 JVM 工作目录漂移。
  defaultTextColor: "#FBDBB3"
  defaultBgColor: "#4C361F"
  factionColor: "#9F6A3B"

storage:
  enable:
    versioning: true
  max:
    file:
      size: 50
  supported:
    formats: "jpg,jpeg,png,gif,bmp,webp"
  generate:
    thumbnails: true
  thumbnail:
    width: 300
    height: 300

app:
  renderThreads: 8
  cacheEnabled: true

logging:
  level:
    com.lbc_plot: INFO
