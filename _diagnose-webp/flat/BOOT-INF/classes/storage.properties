# 存储配置
#
# 注意：storage.backgrounds.dir / storage.thumbnails.dir 虽然可以在这里配置，
# 但 StorageConfig.afterPropertiesSet() 会用 AppConfig 的值覆盖它们，而 AppConfig
# 又是从 com.lbc_plot.common.util.RuntimePaths 推导出的绝对路径
# （{dataRoot}/assets/backgrounds、{dataRoot}/assets/thumbnails）。
# 因此这里不再写出 "assets/..." 这类相对路径，避免造成"配置生效了"的误解。

# 是否启用文件版本控制（文件名中包含哈希值）
storage.enable.versioning=true

# 最大文件大小（MB）
storage.max.file.size=10

# 支持的图片格式
# webp：上传后按原格式保存，读取时由 WebpImageDecoder（FFmpeg/JavaCV 兜底）解码，保留透明通道
storage.supported.formats=jpg,jpeg,png,gif,bmp,webp

# 是否生成缩略图
storage.generate.thumbnails=true

# 缩略图宽度
storage.thumbnail.width=200

# 缩略图高度
storage.thumbnail.height=200
