# Spring Boot 配置

# 服务器端口
server.port=8081

# 主类配置
spring.main.main-class=com.lbc_plot.MainApplication

# 数据库配置：
# 不要把 spring.datasource.url 写在这里！
# 本文件（application.properties）的优先级高于 application.yml，一旦在此写死相对路径，
# 就会覆盖 yml 里 ${lbc.datasource.url} 的绝对路径，使不同 JVM 工作目录打开不同的库文件
# （这正是历史上"明明改了配置却不生效"的原因）。
# SQLite 连接串统一由 com.lbc_plot.common.util.RuntimePaths 解析，yml 中引用即可。

# JPA配置
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 日志配置
logging.level.com.lbc_plot=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
