# 日志文件路径
LOG_FILE_PATH=logs/application.log

# 日志文件最大大小
LOG_MAX_SIZE=10MB

# 保留的历史日志文件数量
LOG_MAX_HISTORY=30

# 总日志文件大小限制
LOG_TOTAL_SIZE_CAP=1GB

# 应用日志级别
APP_LOG_LEVEL=DEBUG

# Spring框架日志级别
SPRING_LOG_LEVEL=INFO

# 控制台日志输出格式
CONSOLE_LOG_PATTERN=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# 文件日志输出格式
FILE_LOG_PATTERN=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
