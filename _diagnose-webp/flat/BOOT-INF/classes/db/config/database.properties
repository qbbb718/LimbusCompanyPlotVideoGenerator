# 数据库连接配置
# 使用 data 目录存储数据库文件，以便应用启动时能够统一管理
# 指定相对路径有助于在不同工作目录下保持一致
# jdbc:sqlite:./data/project.db 会在项目根下的 data 文件夹创建 project.db

# 如果需要使用绝对路径，请自行修改
# database.url=jdbc:sqlite:/absolute/path/to/project.db

database.url=jdbc:sqlite:./data/project.db

# 连接池大小（如果你的应用需要）
connection.pool.size=10

# 其他可能的配置项，比如超时时间等
# connection.timeout=30