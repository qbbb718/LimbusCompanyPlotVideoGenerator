<!doctype html>
<!--
  立绘动画截帧验收 - 浏览器舞台

  这不是一个"仿写的预览"，它就是真预览的那一层：位置用百分比（与 PreviewSceneLayer 一致），
  变换字符串来自真实的 domTransform.spriteDomStyle，变换值来自真实的 spriteAnimator.evaluate。
  唯一的区别是舞台尺寸固定成成片分辨率，这样截图才能和成片帧逐像素比质心。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>立绘动画截帧验收</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* 成片背景是黑的（本记录没有背景图） */
        background: #000;
      }

      #stage {
        position: relative;
        overflow: hidden;
        background: #000;
        /* 与 .preview-stage 一致：绝对定位、左上角对齐 */
        left: 0;
        top: 0;
      }

      /* 与 preview.css 的 .preview-scene-item 对齐：绝对定位 + object-fit: fill */
      .sprite {
        position: absolute;
        object-fit: fill;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="./stage.js"></script>
  </body>
</html>
