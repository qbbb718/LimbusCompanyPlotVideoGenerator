<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PortraitModal 排版检查</title>
    <!-- 直接引用真实样式表：这里要看的正是 CharacterModal.css 里新加的 .portrait-modal 规则 -->
    <link
      rel="stylesheet"
      href="../../demo/frontend/electron-react-app/src/features/common/components/ResourceManager/tabs/CharacterModal.css"
    />
    <link
      rel="stylesheet"
      href="../../demo/frontend/electron-react-app/src/features/common/components/ResourceManager/ResourceManager.css"
    />
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      /* 真实裁剪器画的是立绘，这里用一张素材库里的立绘顶替 */
      .fake-cropper img {
        display: block;
        height: 100%;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="modal-overlay">
      <div class="modal-content portrait-modal">
        <div class="modal-header">
          <h2>编辑立绘</h2>
          <div class="header-actions">
            <button type="button" class="btn-primary">保存</button>
            <button type="button" class="btn-secondary">取消</button>
            <button type="button" class="close-button" aria-label="关闭编辑立绘">
              ×
            </button>
          </div>
        </div>

        <div class="modal-body">
          <div class="portrait-editor">
            <div class="portrait-preview">
              <div class="file-upload">
                <button class="file-upload-button">选择立绘文件</button>
              </div>
              <div
                class="cropper-container fake-cropper"
                style="
                  position: relative;
                  width: 100%;
                  height: 500px;
                  overflow: hidden;
                  background-color: #e8e8e8;
                  border: 1px solid #ddd;
                  border-radius: 4px;
                "
              >
                <img
                  src="../../demo/assets/characters/01李箱/李箱-default.webp"
                  alt="立绘"
                />
              </div>
              <div class="portrait-preview-actions">
                <button class="btn-secondary">按截图校准</button>
                <button class="btn-secondary">预览</button>
              </div>
            </div>

            <div class="portrait-settings">
              <div class="form-group">
                <label>立绘名称</label>
                <input type="text" value="李箱-face_happy_L" />
              </div>
              <div class="form-group">
                <label for="emotion">情绪</label>
                <select id="emotion" class="emotion-select">
                  <option>开心</option>
                </select>
              </div>
              <div class="form-group">
                <label>调整位置</label>
                <div class="form-row">
                  <div class="form-row-item">
                    <label class="form-row-label">X</label>
                    <input type="number" value="0" />
                  </div>
                  <div class="form-row-item">
                    <label class="form-row-label">Y</label>
                    <input type="number" value="0" />
                  </div>
                </div>
              </div>

              <div class="form-group crop-hint">
                <p class="crop-hint-text">
                  请从下巴框选至头顶（不含头发厚度）
                  <br />
                  裁剪区域将用于计算缩放比例
                  <br />
                  拖动裁剪框可改位置；滚轮 / 拖动框外只缩放平移画面，框跟立绘走、不改裁剪值
                </p>
                <img
                  class="crop-hint-image"
                  src="head-crop-guideline.png"
                  alt="头部裁剪区域示例"
                />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
