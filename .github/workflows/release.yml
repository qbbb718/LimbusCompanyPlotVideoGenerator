name: Build and Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 版本号真源是 demo/frontend/electron-react-app/package.json。
      # tag 版本与实际版本不一致（或 package.json / pom.xml / package-lock.json 三者不一致）时
      # 立刻失败，而不是打出一个文件名/版本号对不上的安装包。
      # workflow_dispatch（没有 tag）时只校验三处是否互相一致。
      - name: Verify version consistency
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            node scripts/version.mjs --check-tag '${{ github.ref_name }}'
          } else {
            node scripts/version.mjs --check
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/version.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 更新说明的解析器：解析错了会静默打出"更新内容：空白"的安装包，必须在发版前先红
          node scripts/changelog.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # latest.yml 的解析：解析错了就是"永远发现不了新版本"，同样静默
          node scripts/update-manifest.test.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # Node 18 装不动现在的依赖：@testing-library/jest-dom@6.10 要求 node >= 22，
      # brace-expansion@5 要求 20 || >= 22。Node 18 自带的 npm 10 还会以
      # "Missing: yaml@2.9.1 from lock file" 判锁文件不同步（npm 11 生成的锁文件里，
      # tailwindcss -> postcss-load-config 的可选 peer yaml@2 可以整条缺席），
      # 这就是 0.6.0 打包失败的两个原因。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: demo/frontend/electron-react-app/package-lock.json

      # 锁文件是 npm 11 生成的，就固定用 npm 11 装；npm 10 对"可选 peer 依赖"的
      # 完整性检查比 npm 11 严，版本混用会让同一份锁文件在 CI 上红、在本机绿。
      - name: Pin npm 11
        run: npm install --global npm@11

      # 放在 Maven 之前：依赖装不上就立刻红，而不是先白等两分钟的后端构建。
      - name: Install Frontend Dependencies
        run: npm ci --no-audit --no-fund
        working-directory: demo/frontend/electron-react-app

      - name: Build Backend (Maven)
        run: mvn clean package -DskipTests -q
        working-directory: demo

      - name: Generate Bundled JRE (jlink)
        run: |
          if not exist "demo\jre\bin\java.exe" (
            if exist "demo\jre" rmdir /s /q "demo\jre"
            jlink --add-modules java.base,java.desktop,java.instrument,java.logging,java.management,java.naming,java.sql,java.xml,jdk.unsupported,jdk.management,jdk.crypto.ec,jdk.zipfs,java.net.http,java.security.jgss,java.security.sasl --strip-debug --no-man-pages --no-header-files --compress=zip-6 --output demo\jre
          )
        shell: cmd

      - name: Build Frontend (React)
        run: npm run build
        working-directory: demo/frontend/electron-react-app
        env:
          CI: false

      - name: Package Electron App
        run: npx electron-builder --win --x64 --publish always
        working-directory: demo/frontend/electron-react-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 更新说明在打包之后再生成：changelog.json 要落在 electron-builder 的输出目录里被打包上传，
      # 而 electron-builder 自己会清理/重建 release/ 目录，先放进去会被删掉。
      #   release-notes.md  -> GitHub Release 正文（electron-updater 读它当 releaseNotes）
      #   changelog.json    -> release 资产（走加速通道时改由 public/update-service.js 读它）
      - name: Prepare release notes and changelog
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          node scripts/changelog.mjs --version '${{ github.ref_name }}' --out release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/changelog.mjs --json demo/frontend/electron-react-app/release/changelog.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload release notes, changelog and assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # Release 正文 = 更新说明。electron-updater 的 GitHub provider 会把它当 releaseNotes
          # 带进应用（历史版本的正文一直是空的，所以应用里从来没显示过"更新内容"）。
          body_path: release-notes.md
          # 安装包 / blockmap / latest.yml 由上一步 electron-builder --publish always 上传，
          # 这里只补 changelog.json：同一个文件名上传两次容易踩 "already_exists"，
          # 一旦这一步失败，正文也就跟着丢了。
          files: |
            demo/frontend/electron-react-app/release/changelog.json
