name: Build and Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build Backend (Maven)
        run: mvn clean package -DskipTests -q
        working-directory: demo

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: demo/frontend/electron-react-app

      - name: Build Frontend (React)
        run: npm run build
        working-directory: demo/frontend/electron-react-app
        env:
          CI: false

      - name: Package Electron App
        run: npx electron-builder --win --x64 --publish always
        working-directory: demo/frontend/electron-react-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            demo/frontend/electron-react-app/release/*.exe
            demo/frontend/electron-react-app/release/*.blockmap
            demo/frontend/electron-react-app/release/latest*.yml
